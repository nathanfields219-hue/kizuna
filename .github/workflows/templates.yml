name: Modeles chiffres Kizuna
on:
  push:
    branches: [build-templates]

env:
  GODOT_REF: 4.7.2-stable
  SCONS_COMMON: target=template_release production=yes lto=none debug_symbols=no accesskit=no
  SCRIPT_AES256_ENCRYPTION_KEY: ${{ secrets.KIZUNA_PCK_KEY }}
  PYTHONIOENCODING: utf8

permissions:
  contents: read

jobs:
  windows:
    runs-on: windows-latest
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_REF }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: python -m pip install scons==4.10.1
      - name: ANGLE
        shell: bash
        run: |
          test ${#SCRIPT_AES256_ENCRYPTION_KEY} -eq 64
          python ./misc/scripts/install_angle.py
      - name: WinRT
        shell: bash
        run: python ./misc/scripts/install_winrt.py
        continue-on-error: true
      - name: Compilation
        run: scons platform=windows arch=x86_64 d3d12=no angle=yes ${{ env.SCONS_COMMON }}
      - uses: actions/upload-artifact@v4
        with:
          name: kizuna-windows
          path: bin/godot.windows.template_release.x86_64.exe
          retention-days: 1
          if-no-files-found: error

  linux:
    runs-on: ubuntu-22.04
    timeout-minutes: 180
    steps:
      - uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_REF }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: python -m pip install scons==4.10.1
      - name: Dependances
        run: |
          test ${#SCRIPT_AES256_ENCRYPTION_KEY} -eq 64
          sudo apt-get update
          sudo apt-get install -y libwayland-bin
      - name: Compilation
        run: scons platform=linuxbsd arch=x86_64 ${{ env.SCONS_COMMON }}
      - run: chmod +x bin/godot.linuxbsd.template_release.x86_64
      - uses: actions/upload-artifact@v4
        with:
          name: kizuna-linux
          path: bin/godot.linuxbsd.template_release.x86_64
          retention-days: 1
          if-no-files-found: error

  macos:
    runs-on: macos-26
    timeout-minutes: 240
    steps:
      - uses: actions/checkout@v4
        with:
          repository: godotengine/godot
          ref: ${{ env.GODOT_REF }}
          submodules: recursive
      - uses: actions/setup-python@v5
        with:
          python-version: 3.x
      - run: python -m pip install scons==4.10.1
      - name: ANGLE
        run: |
          test ${#SCRIPT_AES256_ENCRYPTION_KEY} -eq 64
          python ./misc/scripts/install_angle.py
      - name: Compilation x86_64
        run: scons platform=macos arch=x86_64 vulkan=no angle=yes ${{ env.SCONS_COMMON }}
      - name: Compilation arm64
        run: scons platform=macos arch=arm64 vulkan=no angle=yes ${{ env.SCONS_COMMON }}
      - name: Paquet
        run: |
          lipo -create bin/godot.macos.template_release.x86_64 bin/godot.macos.template_release.arm64 -output bin/universal
          strip bin/universal
          cp -R misc/dist/macos_template.app .
          mkdir -p macos_template.app/Contents/MacOS
          cp bin/universal macos_template.app/Contents/MacOS/godot_macos_release.universal
          chmod +x macos_template.app/Contents/MacOS/godot_macos_release.universal
          zip -q -9 -r macos.zip macos_template.app
      - uses: actions/upload-artifact@v4
        with:
          name: kizuna-macos
          path: macos.zip
          retention-days: 1
          if-no-files-found: error
